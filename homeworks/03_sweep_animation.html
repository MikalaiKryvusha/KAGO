  .seg{font-family:"DSEG7",monospace;font-size:11.5px;letter-spacing:.4px}
  .seg.off{fill:#12294a;opacity:.85}
  .seg.on{fill:#3d86ff;filter:url(#neon)}

  :root{
    --bg:#14161a; --panel:#1b1f25; --line:#2a3038; --ink:#e8edf3; --dim:#8b98a8;
    --ice:#8794a3; --fire:#ff7a3c; --ok:#4ade80; --alarm:#ff4d4d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 18px;max-width:940px}
  .bar{display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--ice)}
  button.hang{border-color:var(--alarm);color:#ffb3b3}
  .wrap{display:grid;grid-template-columns:minmax(520px,1fr) minmax(250px,320px);
        gap:20px;align-items:start;max-width:1080px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
  .stage{background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:2px}
  svg{display:block;width:100%;height:auto}
  .m{background:#0f1216;border:1px solid var(--line);border-radius:8px;
     padding:9px 12px;margin-bottom:9px}
  .m b{display:block;font-size:29px;line-height:1.1;font-variant-numeric:tabular-nums}
  .m span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .state{font-weight:700;letter-spacing:.02em;font-size:17px;margin:14px 0 0}
  .alive{color:var(--ok)} .dead{color:var(--alarm);display:none}
  body.hung .alive{display:none} body.hung .dead{display:block}
  body.hung .spin,body.hung .arm,body.hung .rock{animation-play-state:paused!important}
  /* шапка прогона */
  .head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 18px}
  /* фирменный чип: мастер 1024 в assets/logo, здесь webp 512 — отдаётся вдвое
     легче PNG и остаётся резким на любом масштабе окна */
  .head .logo{width:72px;height:72px;display:block}
  .head .brand{font-size:56px;font-weight:800;letter-spacing:.06em;line-height:1;
               background:linear-gradient(180deg,#eef4fb,#9fb0c2);-webkit-background-clip:text;
               background-clip:text;color:transparent}
  .head .what{font-size:22px;font-weight:600;color:#c9d3df}
  /* показания карты — строкой под рисунком, а не поверх лопастей */
  .telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .telemetry div{background:#0f1216;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .telemetry b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
  .telemetry span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  footer{margin-top:24px;color:var(--dim);font-size:13px;max-width:940px}
  code{background:#0f1216;border:1px solid var(--line);border-radius:4px;padding:1px 5px}

  /* ── ДВИЖЕНИЕ ────────────────────────────────────────────────────────────
     МЕДЛЕННО И РОВНО (слово владельца: «почти усыпляющие, чтобы не раздражали
     оператора»). Медленное ровное движение при остановке заметнее быстрого:
     быстрое смазывается в глазу.

     ОДНА СКОРОСТЬ И ОДИН ЦВЕТ У ВСЕХ ТРЁХ — слово владельца. Заодно это правда
     о карте: три кулера идут по ОДНОЙ кривой оборотов, так что разные скорости
     были бы выдумкой. К телеметрии период НЕ привязан — анимация чистая графика.

     Одно условие держим твёрдо: у вентиляторов НЕТ пауз. Паузу нельзя отличить
     от смерти, поэтому сигнал жизни несут именно они; отвёртке паузы разрешены. */
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Ход и хват. Слово владельца: ключ должен «чуть приподниматься,
     перекидываться, крутить, перекидываться, крутить». Так гайку и крутят
     рожковым ключом: за один заход он проворачивает её на угол зева, потом
     СНИМАЕТСЯ, отводится назад и садится снова. Поэтому подъём и поворот
     работают в паре: короткие приподнимания приходятся ровно на перехваты. */
  .arm{animation:arm 24s ease-in-out infinite}
  @keyframes arm{
    0%,3%    {transform:translateY(0)}
    12%      {transform:translateY(22px)}
    20%      {transform:translateY(22px)}
    23%      {transform:translateY(16px)}
    28%      {transform:translateY(22px)}
    36%      {transform:translateY(22px)}
    39%      {transform:translateY(16px)}
    44%      {transform:translateY(22px)}
    52%      {transform:translateY(22px)}
    55%      {transform:translateY(16px)}
    60%      {transform:translateY(22px)}
    68%      {transform:translateY(22px)}
    77%,100% {transform:translateY(0)}
  }
  /* Поворот идёт вокруг ЗЕВА — то есть вокруг гайки. Рабочий ход по часовой,
     перехват — обратно, и обратный ход быстрее рабочего, как рукой и делают. */
  .rock{transform-box:view-box;transform-origin:0 0;
        animation:rock 24s ease-in-out infinite}
  @keyframes rock{
    0%,12%  {transform:translate(150px,116px) rotate(-30deg)}
    20%     {transform:translate(150px,116px) rotate(-4deg)}
    23%     {transform:translate(150px,116px) rotate(-4deg)}
    28%     {transform:translate(150px,116px) rotate(-30deg)}
    36%     {transform:translate(150px,116px) rotate(-4deg)}
    39%     {transform:translate(150px,116px) rotate(-4deg)}
    44%     {transform:translate(150px,116px) rotate(-30deg)}
    52%     {transform:translate(150px,116px) rotate(-4deg)}
    55%     {transform:translate(150px,116px) rotate(-4deg)}
    60%     {transform:translate(150px,116px) rotate(-30deg)}
    68%     {transform:translate(150px,116px) rotate(-4deg)}
    77%,100%{transform:translate(150px,116px) rotate(-30deg)}
  }
</style>
</head>
<body>

<div class="head">
  <img class="logo" src="../assets/logo/kago-logo.webp" alt="KAGO" width="72" height="72">
  <span class="brand">KAGO</span>
  <span class="what">Выполняется автоматический тюнинг-прогон видеокарты</span>
</div>


<div class="wrap">
  <div class="card">
    <div class="stage">
      <svg viewBox="0 14 380 278" role="img" aria-label="Видеокарта с тремя вентиляторами и отвёрткой">
        <defs>
          <linearGradient id="shroud" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4a525d"/><stop offset=".45" stop-color="#343b45"/>
            <stop offset="1" stop-color="#252b33"/>
          </linearGradient>
          <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5b6572"/><stop offset="1" stop-color="#3d4550"/>
          </linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e8c877"/><stop offset="1" stop-color="#a8862f"/>
          </linearGradient>
          <!-- сталь стержня: блик слева от центра, тень справа — цилиндр -->
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#5f6873"/><stop offset=".28" stop-color="#e6edf5"/>
            <stop offset=".55" stop-color="#b6c0cc"/><stop offset="1"   stop-color="#5a636e"/>
          </linearGradient>
          <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6b7480"/><stop offset=".3" stop-color="#dde4ec"/>
            <stop offset=".62" stop-color="#9ba5b1"/><stop offset="1" stop-color="#646d78"/>
          </linearGradient>
          <!-- Базовый тон ручки РОВНЫЙ. Объём даёт не он, а слои света ниже:
               смешивать градиент тела с текстурой — как раз то, что делало
               ручку плоской. -->
          <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d9601f"/><stop offset="1" stop-color="#d9601f"/>
          </linearGradient>
          <!-- ТЕНЬ ЦИЛИНДРА: тёмное к обеим кромкам, светлое там, где нормаль
               смотрит на зрителя. Асимметрично — свет слева сверху. -->
          <linearGradient id="cylShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#000" stop-opacity=".66"/>
            <stop offset=".13"  stop-color="#000" stop-opacity=".26"/>
            <stop offset=".34"  stop-color="#000" stop-opacity="0"/>
            <stop offset=".58"  stop-color="#000" stop-opacity=".06"/>
            <stop offset=".82"  stop-color="#000" stop-opacity=".42"/>
            <stop offset=".95"  stop-color="#000" stop-opacity=".62"/>
            <stop offset="1"    stop-color="#000" stop-opacity=".5"/>
          </linearGradient>
          <!-- ЗЕРКАЛЬНЫЙ БЛИК: узкая горячая полоса, не размазанная по всей ручке -->
          <linearGradient id="cylSpec" x1="0" y1="0" x2="1" y2="0">
            <stop offset=".14" stop-color="#fff1e2" stop-opacity="0"/>
            <stop offset=".24" stop-color="#fff1e2" stop-opacity=".55"/>
            <stop offset=".3"  stop-color="#fff8f0" stop-opacity=".72"/>
            <stop offset=".38" stop-color="#fff1e2" stop-opacity="0"/>
          </linearGradient>
          <!-- ОТРАЖЁННЫЙ СВЕТ на тёмной кромке: в природе тень никогда не чёрная,
               её подсвечивает окружение. Без этой полосы цилиндр плоский. -->
          <linearGradient id="cylRim" x1="0" y1="0" x2="1" y2="0">
            <stop offset=".84" stop-color="#ff9d5e" stop-opacity="0"/>
            <stop offset=".93" stop-color="#ff9d5e" stop-opacity=".42"/>
            <stop offset="1"   stop-color="#ff9d5e" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="domeLight" cx=".5" cy=".5" r=".5">
            <stop offset="0"   stop-color="#fff3e6" stop-opacity=".5"/>
            <stop offset="1"   stop-color="#fff3e6" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="waistShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#000" stop-opacity="0"/>
            <stop offset=".55" stop-color="#000" stop-opacity=".3"/>
            <stop offset="1"   stop-color="#000" stop-opacity="0"/>
          </linearGradient>

          <!-- ЛОПАСТЬ: скошенная, от ступицы (r10) до обода (r31) -->
          <path id="blade"
                d="M-2.25,-9.74 L2.25,-9.74 Q11,-17.5 17.8,-25.4
                   A31,31 0 0 0 4.85,-30.62 Q1.6,-19.5 -2.25,-9.74 Z"/>

          <g id="fan">
            <rect x="-37" y="-37" width="74" height="74" rx="9" fill="#222830" stroke="#4d5661"/>
            <circle r="34.5" fill="#12161b" stroke="#525c68"/>
            <circle r="32.6" fill="none"    stroke="#2c333b"/>
            <g fill="#6d7885" opacity=".85">
              <circle cx="-30" cy="-30" r="2.3"/><circle cx="30" cy="-30" r="2.3"/>
              <circle cx="-30" cy="30"  r="2.3"/><circle cx="30" cy="30"  r="2.3"/>
            </g>
          </g>

          <g id="rotor">
            <use href="#blade"/>
            <use href="#blade" transform="rotate(32.73)"/>
            <use href="#blade" transform="rotate(65.45)"/>
            <use href="#blade" transform="rotate(98.18)"/>
            <use href="#blade" transform="rotate(130.9)"/>
            <use href="#blade" transform="rotate(163.6)"/>
            <use href="#blade" transform="rotate(196.4)"/>
            <use href="#blade" transform="rotate(229.1)"/>
            <use href="#blade" transform="rotate(261.8)"/>
            <use href="#blade" transform="rotate(294.5)"/>
            <use href="#blade" transform="rotate(327.3)"/>
          </g>

          <!-- СИЛУЭТ РУЧКИ: купол сверху, плечо, перехват, расширение к обойме.
               Точёная форма вместо бочонка — по ней же обрезаются грани. -->
          <path id="grip-shape"
                d="M0,-112
                   C 9,-112 15,-107 16,-99
                   C 17,-92 18,-86 18,-80
                   C 18,-73 14,-70 13,-66
                   C 12,-62 15,-59 16,-56
                   C 17,-53 15,-52 12,-52
                   L -12,-52
                   C -15,-52 -17,-53 -16,-56
                   C -15,-59 -12,-62 -13,-66
                   C -14,-70 -18,-73 -18,-80
                   C -18,-86 -17,-92 -16,-99
                   C -15,-107 -9,-112 0,-112 Z"/>
          <clipPath id="gripClip"><use href="#grip-shape"/></clipPath>
          <filter id="neon" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="1.1" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <!-- ПЛОСКАЯ КОВАНАЯ СТАЛЬ: тёмные кромки, светлая середина, узкая
               фаска. У плоской детали объём даёт именно фаска по контуру. -->
          <linearGradient id="wrenchBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#5b636d"/>
            <stop offset=".18" stop-color="#aab4c0"/>
            <stop offset=".42" stop-color="#e8eef5"/>
            <stop offset=".62" stop-color="#b9c3cf"/>
            <stop offset=".86" stop-color="#78818c"/>
            <stop offset="1"   stop-color="#4e565f"/>
          </linearGradient>
          <linearGradient id="wrenchBevel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#fff" stop-opacity=".0"/>
            <stop offset=".33" stop-color="#fff" stop-opacity=".55"/>
            <stop offset=".46" stop-color="#fff" stop-opacity=".0"/>
          </linearGradient>
        </defs>
        <!-- ── ПЛАТА, ЗАДНЯЯ ПЛАСТИНА, ГРЕБЁНКА PCIe ───────────────────── -->
        <!-- Медь идёт САМОЙ ПЕРВОЙ — ниже неё в рисунке нет ничего: ни платы,
             ни кожуха, ни кронштейна. Поэтому она выходит из-под всего сразу.
             Гребёнка сплошной медяшкой: зубы дробили взгляд. -->
        <g>
          <rect x="70" y="240" width="132" height="26" rx="1.5" fill="url(#gold)"/>
          <rect x="212" y="240" width="52" height="26" rx="1.5" fill="url(#gold)"/>
        </g>
        <rect x="34" y="230" width="316" height="22" rx="2" fill="#1e232a" stroke="#39424d"/>


        <!-- ── ГАЕЧНЫЙ КЛЮЧ ────────────────────────────────────────────────
             Вектор — Bootstrap Icons «wrench» (MIT), скачан и положен в
             assets/icons/. Рисовать такую форму руками я пробовал трижды и
             трижды получал подделку; готовый вектор честнее и чище.

             Ключ развёрнут на 180°, чтобы РОЖКОВЫЙ ЗЕВ оказался внизу, и стоит
             к карте под сильным углом — как и держат ключ, а не перпендикуляром.
             Точка зева совмещена с началом координат: вокруг неё идёт вращение,
             потому что вокруг гайки ключ и поворачивается.

             Рисуется ПЕРВЫМ после контактов — значит уходит за кожух сам. -->
        <g class="arm">
          <g class="rock">
              <g transform="scale(-1,1)">
              <g transform="translate(-75,-75) scale(5.6)">
                <g transform="rotate(180 8 8)">
                  <path d="M.102 2.223A3.004 3.004 0 0 0 3.78 5.897l6.341 6.252A3.003 3.003 0 0 0 13 16a3 3 0 1 0-.851-5.878L5.897 3.781A3.004 3.004 0 0 0 2.223.1l2.141 2.142L4 4l-1.757.364zm13.37 9.019.528.026.287.445.445.287.026.529L15 13l-.242.471-.026.529-.445.287-.287.445-.529.026L13 15l-.471-.242-.529-.026-.287-.445-.445-.287-.026-.529L11 13l.242-.471.026-.529.445-.287.287-.445.529-.026L13 11z" fill="url(#wrenchBody)" stroke="#39414a"
                        stroke-width=".22" stroke-linejoin="round"/>
                  <path d="M.102 2.223A3.004 3.004 0 0 0 3.78 5.897l6.341 6.252A3.003 3.003 0 0 0 13 16a3 3 0 1 0-.851-5.878L5.897 3.781A3.004 3.004 0 0 0 2.223.1l2.141 2.142L4 4l-1.757.364zm13.37 9.019.528.026.287.445.445.287.026.529L15 13l-.242.471-.026.529-.445.287-.287.445-.529.026L13 15l-.471-.242-.529-.026-.287-.445-.445-.287-.026-.529L11 13l.242-.471.026-.529.445-.287.287-.445.529-.026L13 11z" fill="url(#wrenchBevel)"/>
                </g>
              </g>
              </g>
            </g>
          </g>

        <!-- ── КРОНШТЕЙН, ВИД С РЕБРА ────────────────────────────────────
             Правка по замечанию владельца: раньше планка была развёрнута
             ЛИЦОМ к зрителю, с видимыми окнами разъёмов, — так не бывает.
             Кронштейн привинчен к задней стенке корпуса, то есть при виде
             сбоку он виден С РЕБРА: тонкая полоса металла с отогнутой
             верхней лапкой под винт. Никаких окон разъёмов отсюда не видно. -->
        <g>
          <rect x="24.5" y="124" width="4.5" height="144" fill="#4e5763"/>
          <rect x="24.5" y="124" width="4.5" height="144" fill="none" stroke="#3a424c" stroke-width=".6"/>
          <rect x="25.3" y="124" width="1" height="144" fill="#aebac7" opacity=".18"/>
          <!-- отогнутая лапка крепления, уходит к корпусу -->
          <path d="M24.5,124 L29,124 L29,118 L34,118 L34,121 L29,121 Z" fill="#4e5763" stroke="#3a424c" stroke-width=".6"/>
          <circle cx="31.6" cy="119.5" r="1.1" fill="#20262e"/>
          <!-- нижний упор -->
          <rect x="24.5" y="266" width="4.5" height="3.5" rx="1" fill="#454e59"/>
        </g>

        <!-- ── КОЖУХ ───────────────────────────────────────────────────── -->
        <path d="M30,130 L352,130 L352,246 L30,246 Z" fill="url(#shroud)" stroke="#5d6773"/>
        <path d="M30,130 L352,130 L352,144 L30,144 Z" fill="url(#rail)" opacity=".5"/>
        <g stroke="#1d222a" stroke-width="2" opacity=".6">
          <path d="M64,130 L48,144"/><path d="M334,130 L318,144"/>
          <path d="M64,246 L48,232"/><path d="M334,246 L318,232"/>
        </g>
        <g>
          <rect x="296" y="118" width="50" height="13" rx="2.5" fill="#2b323b" stroke="#69737f"/>
          <g fill="#4d5661">
            <rect x="300" y="121" width="9" height="7" rx="1"/><rect x="311" y="121" width="9" height="7" rx="1"/>
            <rect x="322" y="121" width="9" height="7" rx="1"/><rect x="333" y="121" width="9" height="7" rx="1"/>
          </g>
        </g>

        <!-- ── ТРИ ВЕНТИЛЯТОРА: один цвет, одна скорость ───────────────── -->
        <g transform="translate(94,178)">
          <use href="#fan"/>
          <g class="spin">
            <use href="#rotor" fill="var(--ice)" opacity=".92"/>
            <circle r="9" fill="#2b323b" stroke="#6d7885"/><circle r="3.2" fill="#6d7885"/>
          </g>
        </g>
        <g transform="translate(190,178)">
          <use href="#fan"/>
          <g class="spin">
            <use href="#rotor" fill="var(--ice)" opacity=".92"/>
            <circle r="9" fill="#2b323b" stroke="#6d7885"/><circle r="3.2" fill="#6d7885"/>
          </g>
        </g>
        <g transform="translate(286,178)">
          <use href="#fan"/>
          <g class="spin">
            <use href="#rotor" fill="var(--ice)" opacity=".92"/>
            <circle r="9" fill="#2b323b" stroke="#6d7885"/><circle r="3.2" fill="#6d7885"/>
          </g>
        </g>

        <!-- ── ЧЕТЫРЕ СЕМИСЕГМЕНТНЫХ ИНДИКАТОРА НА САМОЙ КАРТЕ ───────────
             Шрифт DSEG7 Classic (SIL OFL) — настоящий сегментный, встроен в
             страницу base64, а не тянется из сети: дашборд поднимается во время
             прогона, и внешний запрос отказал бы ровно тогда, когда сети нет.
             Погашенные сегменты — штатный приём DSEG: тусклая «8888» подложкой,
             поверх неё яркое значение. Общего контейнера у панелей нет.
             Это ДАННЫЕ, а не анимация. -->
        <g>
          <g>
            <rect x="34" y="219" width="76" height="20" rx="2.5" fill="#04121e" stroke="#1d4055"/>
            <text x="38" y="227" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">CLK</text>
            <text x="38" y="236.5" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">MHz</text>
            <text class="seg off" x="106" y="235" text-anchor="end">8888</text>
            <text class="seg on"  x="106" y="235" text-anchor="end">2842</text>
          </g>
          <g>
            <rect x="113" y="219" width="76" height="20" rx="2.5" fill="#04121e" stroke="#1d4055"/>
            <text x="117" y="227" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">TEMP</text>
            <text x="117" y="236.5" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">C</text>
            <text class="seg off" x="185" y="235" text-anchor="end">88</text>
            <text class="seg on"  x="185" y="235" text-anchor="end">74</text>
          </g>
          <g>
            <rect x="192" y="219" width="76" height="20" rx="2.5" fill="#04121e" stroke="#1d4055"/>
            <text x="196" y="227" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">FAN</text>
            <text x="196" y="236.5" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">%</text>
            <text class="seg off" x="264" y="235" text-anchor="end">88</text>
            <text class="seg on"  x="264" y="235" text-anchor="end">62</text>
          </g>
          <g>
            <rect x="271" y="219" width="76" height="20" rx="2.5" fill="#04121e" stroke="#1d4055"/>
            <text x="275" y="227" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">PWR</text>
            <text x="275" y="236.5" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">W</text>
            <text class="seg off" x="343" y="235" text-anchor="end">888</text>
            <text class="seg on"  x="343" y="235" text-anchor="end">248</text>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <div>
    <div class="m"><span>частота под тестом</span><b>2842 МГц</b></div>
    <!-- «4 из 24» убрано: номер ступени внутри спуска не говорит оператору ничего.
         Говорит ГЛУБИНА — сколько уже снято от заводского напряжения. -->
    <div class="m"><span>напряжение</span><b>995 мВ</b>
      <span style="text-transform:none;letter-spacing:0;font-size:13px;color:#c9d3df">
        сток 1045 · андервольт <b style="display:inline;font-size:13px;color:var(--ok)">−50 мВ</b></span></div>
    <!-- «прожиг» — жаргон (слово владельца 2026-08-16). На самом деле идёт
         СТРЕСС-ТЕСТ УСТОЙЧИВОСТИ, так и называем — здесь и во всём, что он читает. -->
    <div class="m"><span>стресс-тест устойчивости</span><b>6,2 <span style="font-size:17px;color:var(--dim)">из 10 с</span></b></div>
    <div class="m"><span>пройдено по диапазону частот</span><b>2842…2800</b>
      <span style="text-transform:none;letter-spacing:0;font-size:13px;color:#c9d3df">
        настроено частот <b style="display:inline;font-size:13px">7 из 43</b></span></div>
    <p class="state alive">● ИДЁТ СТРЕСС-ТЕСТ</p>
    <p class="state dead">■ ЗАМЕРЛО — 2842 МГц / 995 мВ</p>
  </div>
</div>
