<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- KAGO logo, the chip BASE: strict graphite body + gold pins, nothing on the face.
       The face carries the Fluent Emoji 3D snowflake and fire, composited by ImageMagick
       (assets/logo/README.md) — the owner's word: «иконки снежинки и пламени как в емодзиках». -->
  <defs>
    <linearGradient id="pinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="pinH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4152"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
  </defs>

  <g fill="url(#pinV)">
    <rect x="60"  y="12" width="16" height="30" rx="6"/>
    <rect x="100" y="12" width="16" height="30" rx="6"/>
    <rect x="140" y="12" width="16" height="30" rx="6"/>
    <rect x="180" y="12" width="16" height="30" rx="6"/>
    <rect x="60"  y="214" width="16" height="30" rx="6"/>
    <rect x="100" y="214" width="16" height="30" rx="6"/>
    <rect x="140" y="214" width="16" height="30" rx="6"/>
    <rect x="180" y="214" width="16" height="30" rx="6"/>
  </g>
  <g fill="url(#pinH)">
    <rect x="12" y="60"  width="30" height="16" rx="6"/>
    <rect x="12" y="100" width="30" height="16" rx="6"/>
    <rect x="12" y="140" width="30" height="16" rx="6"/>
    <rect x="12" y="180" width="30" height="16" rx="6"/>
    <rect x="214" y="60"  width="30" height="16" rx="6"/>
    <rect x="214" y="100" width="30" height="16" rx="6"/>
    <rect x="214" y="140" width="30" height="16" rx="6"/>
    <rect x="214" y="180" width="30" height="16" rx="6"/>
  </g>

  <rect x="34" y="34" width="188" height="188" rx="30" fill="url(#body)"/>
  <rect x="34" y="34" width="188" height="188" rx="30" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="2"/>

  <!-- the glint: a barely-there gray diagonal between the snowflake (top-left) and the fire
       (bottom-right) — fades in from nothing and out into nothing, like light across the chip
       (owner's word). Gradient runs ALONG the stroke (bbox corners of the diagonal path). -->
  <linearGradient id="glint" gradientUnits="userSpaceOnUse" x1="60" y1="196" x2="196" y2="60">
    <stop offset="0"    stop-color="#cfd6e4" stop-opacity="0"/>
    <stop offset="0.5"  stop-color="#cfd6e4" stop-opacity="0.3"/>
    <stop offset="1"    stop-color="#cfd6e4" stop-opacity="0"/>
  </linearGradient>
  <path d="M60 196 L196 60" stroke="url(#glint)" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
