<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- KAGO chip logo, candidate A «Аврора»: graphite chip, aurora-gradient die, gold pins, K monogram -->
  <defs>
    <linearGradient id="pinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="pinH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4152"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37e6c3"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- pins: 4 per side, chunky so they survive 16 px -->
  <g>
    <g fill="url(#pinV)">
      <rect x="60"  y="12" width="16" height="30" rx="6"/>
      <rect x="100" y="12" width="16" height="30" rx="6"/>
      <rect x="140" y="12" width="16" height="30" rx="6"/>
      <rect x="180" y="12" width="16" height="30" rx="6"/>
      <rect x="60"  y="214" width="16" height="30" rx="6"/>
      <rect x="100" y="214" width="16" height="30" rx="6"/>
      <rect x="140" y="214" width="16" height="30" rx="6"/>
      <rect x="180" y="214" width="16" height="30" rx="6"/>
    </g>
    <g fill="url(#pinH)">
      <rect x="12" y="60"  width="30" height="16" rx="6"/>
      <rect x="12" y="100" width="30" height="16" rx="6"/>
      <rect x="12" y="140" width="30" height="16" rx="6"/>
      <rect x="12" y="180" width="30" height="16" rx="6"/>
      <rect x="214" y="60"  width="30" height="16" rx="6"/>
      <rect x="214" y="100" width="30" height="16" rx="6"/>
      <rect x="214" y="140" width="30" height="16" rx="6"/>
      <rect x="214" y="180" width="30" height="16" rx="6"/>
    </g>
  </g>

  <!-- chip body -->
  <rect x="34" y="34" width="188" height="188" rx="30" fill="url(#body)"/>
  <rect x="34" y="34" width="188" height="188" rx="30" fill="none" stroke="#000000" stroke-opacity="0.33" stroke-width="2"/>

  <!-- die -->
  <rect x="66" y="66" width="124" height="124" rx="18" fill="url(#die)"/>
  <rect x="66" y="66" width="124" height="124" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- K monogram -->
  <g stroke="#0b1020" stroke-opacity="0.85" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M106 96 V160"/>
    <path d="M106 130 L150 96"/>
    <path d="M106 130 L150 160"/>
  </g>
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M106 96 V160"/>
    <path d="M106 130 L150 96"/>
    <path d="M106 130 L150 160"/>
  </g>

  <!-- gloss -->
  <path d="M46 64 Q46 46 64 46 H192 Q210 46 210 64 L210 84 Q128 108 46 84 Z" fill="url(#gloss)"/>
</svg>
