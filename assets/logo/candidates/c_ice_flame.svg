<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- KAGO chip logo, candidate C v2 «Лёд и пламя» — the owner's pick with his correction
       (2026-08-14): no separate die container; a strict graphite chip with a NEAT snowflake and
       flame drawn directly on its face. Ice = Silent Cold, flame = Max Perfomance. -->
  <defs>
    <linearGradient id="pinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="pinH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4152"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="iceStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#7cc7ff"/>
    </linearGradient>
    <linearGradient id="flameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e23b2e"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <!-- pins: 4 per side, chunky so they survive 16 px -->
  <g fill="url(#pinV)">
    <rect x="60"  y="12" width="16" height="30" rx="6"/>
    <rect x="100" y="12" width="16" height="30" rx="6"/>
    <rect x="140" y="12" width="16" height="30" rx="6"/>
    <rect x="180" y="12" width="16" height="30" rx="6"/>
    <rect x="60"  y="214" width="16" height="30" rx="6"/>
    <rect x="100" y="214" width="16" height="30" rx="6"/>
    <rect x="140" y="214" width="16" height="30" rx="6"/>
    <rect x="180" y="214" width="16" height="30" rx="6"/>
  </g>
  <g fill="url(#pinH)">
    <rect x="12" y="60"  width="30" height="16" rx="6"/>
    <rect x="12" y="100" width="30" height="16" rx="6"/>
    <rect x="12" y="140" width="30" height="16" rx="6"/>
    <rect x="12" y="180" width="30" height="16" rx="6"/>
    <rect x="214" y="60"  width="30" height="16" rx="6"/>
    <rect x="214" y="100" width="30" height="16" rx="6"/>
    <rect x="214" y="140" width="30" height="16" rx="6"/>
    <rect x="214" y="180" width="30" height="16" rx="6"/>
  </g>

  <!-- strict graphite body, thin dark edge, no gloss band -->
  <rect x="34" y="34" width="188" height="188" rx="30" fill="url(#body)"/>
  <rect x="34" y="34" width="188" height="188" rx="30" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="2"/>

  <!-- ═══ snowflake: 6 identical arms, exact 60° rotations around (90,128); inlined groups —
       the rsvg delegate ignores SVG2 href on <use>, and a stroke gradient degenerates on a
       straight line, so the arms are plain groups with a solid ice color ═══ -->
  <g stroke="#d9efff" stroke-width="7" stroke-linecap="round" fill="none">
    <g>
      <path d="M90 128 V94"/>
      <path d="M90 103 L81 95"/>
      <path d="M90 103 L99 95"/>
    </g>
    <g transform="rotate(60 90 128)">
      <path d="M90 128 V94"/>
      <path d="M90 103 L81 95"/>
      <path d="M90 103 L99 95"/>
    </g>
    <g transform="rotate(120 90 128)">
      <path d="M90 128 V94"/>
      <path d="M90 103 L81 95"/>
      <path d="M90 103 L99 95"/>
    </g>
    <g transform="rotate(180 90 128)">
      <path d="M90 128 V94"/>
      <path d="M90 103 L81 95"/>
      <path d="M90 103 L99 95"/>
    </g>
    <g transform="rotate(240 90 128)">
      <path d="M90 128 V94"/>
      <path d="M90 103 L81 95"/>
      <path d="M90 103 L99 95"/>
    </g>
    <g transform="rotate(300 90 128)">
      <path d="M90 128 V94"/>
      <path d="M90 103 L81 95"/>
      <path d="M90 103 L99 95"/>
    </g>
  </g>
  <circle cx="90" cy="128" r="6" fill="#eef8ff"/>

  <!-- ═══ flame: symmetric teardrop, mirrored halves, lighter core inside ═══ -->
  <path d="M166 92
           C 178 108, 192 120, 192 142
           C 192 160, 181 172, 166 172
           C 151 172, 140 160, 140 142
           C 140 120, 154 108, 166 92 Z"
        fill="url(#flameFill)"/>
  <path d="M166 122
           C 173 131, 180 137, 180 147
           C 180 157, 174 163, 166 163
           C 158 163, 152 157, 152 147
           C 152 137, 159 131, 166 122 Z"
        fill="url(#flameCore)"/>
</svg>
