<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- KAGO chip logo, candidate C «Лёд и пламя»: the die split by KAGO's two poles —
       Silent Cold (ice blue) and Max Performance (flame orange), gold pins -->
  <defs>
    <linearGradient id="pinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="pinH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d067"/>
      <stop offset="0.5" stop-color="#c9932e"/>
      <stop offset="1" stop-color="#8a5d14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333a4a"/>
      <stop offset="1" stop-color="#10121a"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfefff"/>
      <stop offset="1" stop-color="#1e6ad6"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e23b2e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g fill="url(#pinV)">
    <rect x="60"  y="12" width="16" height="30" rx="6"/>
    <rect x="100" y="12" width="16" height="30" rx="6"/>
    <rect x="140" y="12" width="16" height="30" rx="6"/>
    <rect x="180" y="12" width="16" height="30" rx="6"/>
    <rect x="60"  y="214" width="16" height="30" rx="6"/>
    <rect x="100" y="214" width="16" height="30" rx="6"/>
    <rect x="140" y="214" width="16" height="30" rx="6"/>
    <rect x="180" y="214" width="16" height="30" rx="6"/>
  </g>
  <g fill="url(#pinH)">
    <rect x="12" y="60"  width="30" height="16" rx="6"/>
    <rect x="12" y="100" width="30" height="16" rx="6"/>
    <rect x="12" y="140" width="30" height="16" rx="6"/>
    <rect x="12" y="180" width="30" height="16" rx="6"/>
    <rect x="214" y="60"  width="30" height="16" rx="6"/>
    <rect x="214" y="100" width="30" height="16" rx="6"/>
    <rect x="214" y="140" width="30" height="16" rx="6"/>
    <rect x="214" y="180" width="30" height="16" rx="6"/>
  </g>

  <rect x="34" y="34" width="188" height="188" rx="30" fill="url(#body)"/>
  <rect x="34" y="34" width="188" height="188" rx="30" fill="none" stroke="#000000" stroke-opacity="0.33" stroke-width="2"/>

  <!-- die split diagonally: ice above, flame below -->
  <clipPath id="dieClip">
    <rect x="66" y="66" width="124" height="124" rx="18"/>
  </clipPath>
  <g clip-path="url(#dieClip)">
    <rect x="66" y="66" width="124" height="124" fill="url(#ice)"/>
    <path d="M190 66 L66 190 L190 190 Z" fill="url(#flame)"/>
    <!-- snowflake hint, upper-left -->
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9">
      <path d="M104 84 V124"/>
      <path d="M86 94 L122 114"/>
      <path d="M122 94 L86 114"/>
    </g>
    <!-- flame hint, lower-right -->
    <path d="M152 132 q14 12 10 26 q-3 12 -16 16 q-14 4 -22 -6 q-6 -8 -2 -17 q2 6 9 7 q-4 -14 8 -22 q-1 9 6 13 q4 -8 7 -17 Z"
          fill="#fff3b0" opacity="0.95"/>
  </g>
  <rect x="66" y="66" width="124" height="124" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <path d="M46 64 Q46 46 64 46 H192 Q210 46 210 64 L210 82 Q128 104 46 82 Z" fill="url(#gloss)"/>
</svg>
