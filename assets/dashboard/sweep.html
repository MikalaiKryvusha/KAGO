<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KAGO — Выполняется автоматический тюнинг-прогон видеокарты</title>
<style>
  /* DSEG7 Classic — настоящий семисегментный шрифт, SIL OFL.
     Встроен в страницу: дашборд работает без сети, потому что во время
     прогона внешний запрос — это отказ ровно в тот момент, когда он не нужен.
     Файл и лицензия лежат в assets/fonts/. */
  @font-face{font-family:"DSEG7";src:url(/font.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
  .seg{font-family:"DSEG7",monospace;font-size:11.5px;letter-spacing:.4px}
  .seg.off{fill:#12294a;opacity:.85}
  .seg.on{fill:#3d86ff;filter:url(#neon)}

  :root{
    --bg:#14161a; --panel:#1b1f25; --line:#2a3038; --ink:#e8edf3; --dim:#8b98a8;
    --ice:#8794a3; --fire:#ff7a3c; --ok:#4ade80; --alarm:#ff4d4d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 18px;max-width:940px}
  .bar{display:flex;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--ice)}
  button.hang{border-color:var(--alarm);color:#ffb3b3}
  .wrap{display:grid;grid-template-columns:minmax(520px,1fr) minmax(250px,320px);
        gap:20px;align-items:start;max-width:1080px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
  .stage{background:#0f1216;border:1px solid var(--line);border-radius:10px;padding:2px}
  svg{display:block;width:100%;height:auto}
  .m{background:#0f1216;border:1px solid var(--line);border-radius:8px;
     padding:9px 12px;margin-bottom:9px}
  .m b{display:block;font-size:29px;line-height:1.1;font-variant-numeric:tabular-nums}
  .m span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .m.clocks{display:flex;gap:18px}
  .m.clocks>div{flex:1}
  .m.clocks b{font-size:24px}
  .stage{position:relative}
  /* Пилюля «ВИРТУАЛЬНАЯ» — вверху справа НА виджете видеокарты, место выбрал владелец. Огненный
     цвет бренда: заметно, но это не тревога — карта не сломана, она ненастоящая. */
  .pill{position:absolute;top:12px;right:14px;z-index:2;padding:4px 12px;border-radius:999px;
        border:1px solid var(--fire);color:var(--fire);background:rgba(255,122,60,.10);
        font-size:11px;font-weight:700;letter-spacing:.12em}
  .state{font-weight:700;letter-spacing:.02em;font-size:17px;margin:0 0 12px}
  .alive{color:var(--ok)} .dead{color:var(--alarm);display:none}
  body.hung .alive{display:none} body.hung .dead{display:block}
  body.hung .spin,body.hung .arm,body.hung .rock{animation-play-state:paused!important}
  /* шапка прогона */
  .head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 18px}
  /* фирменный чип: мастер 1024 в assets/logo, здесь webp 512 — отдаётся вдвое
     легче PNG и остаётся резким на любом масштабе окна */
  .head .logo{width:72px;height:72px;display:block}
  .head .brand{font-size:56px;font-weight:800;letter-spacing:.06em;line-height:1;
               background:linear-gradient(180deg,#eef4fb,#9fb0c2);-webkit-background-clip:text;
               background-clip:text;color:transparent}
  .head .what{font-size:22px;font-weight:600;color:#c9d3df}
  /* показания карты — строкой под рисунком, а не поверх лопастей */
  .telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .telemetry div{background:#0f1216;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .telemetry b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
  .telemetry span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  footer{margin-top:24px;color:var(--dim);font-size:13px;max-width:940px}
  code{background:#0f1216;border:1px solid var(--line);border-radius:4px;padding:1px 5px}

  /* ── ДВИЖЕНИЕ ────────────────────────────────────────────────────────────
     МЕДЛЕННО И РОВНО (слово владельца: «почти усыпляющие, чтобы не раздражали
     оператора»). Медленное ровное движение при остановке заметнее быстрого:
     быстрое смазывается в глазу.

     ОДНА СКОРОСТЬ И ОДИН ЦВЕТ У ВСЕХ ТРЁХ — слово владельца. Заодно это правда
     о карте: три кулера идут по ОДНОЙ кривой оборотов, так что разные скорости
     были бы выдумкой. К телеметрии период НЕ привязан — анимация чистая графика.

     Одно условие держим твёрдо: у вентиляторов НЕТ пауз. Паузу нельзя отличить
     от смерти, поэтому сигнал жизни несут именно они; отвёртке паузы разрешены. */
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Ход и хват. Слово владельца: ключ должен «чуть приподниматься,
     перекидываться, крутить, перекидываться, крутить». Так гайку и крутят
     рожковым ключом: за один заход он проворачивает её на угол зева, потом
     СНИМАЕТСЯ, отводится назад и садится снова. Поэтому подъём и поворот
     работают в паре: короткие приподнимания приходятся ровно на перехваты. */
  .arm{animation:arm 24s ease-in-out infinite}
  @keyframes arm{
    0%,3%    {transform:translateY(0)}
    12%      {transform:translateY(26px)}
    20%      {transform:translateY(26px)}
    23%      {transform:translateY(20px)}
    28%      {transform:translateY(26px)}
    36%      {transform:translateY(26px)}
    39%      {transform:translateY(20px)}
    44%      {transform:translateY(26px)}
    52%      {transform:translateY(26px)}
    55%      {transform:translateY(20px)}
    60%      {transform:translateY(26px)}
    68%      {transform:translateY(26px)}
    /* Последний перехват — ТАКОЙ ЖЕ, как остальные: ключ СНИМАЕТСЯ с гайки и
       только потом отводится назад. Раньше он отводился посаженным, и поворот
       против часовой на гайке читался как ОТКРУЧИВАНИЕ. */
    71%      {transform:translateY(20px)}
    76%      {transform:translateY(20px)}
    84%,100% {transform:translateY(0)}
  }
  /* Поворот идёт вокруг ЗЕВА — то есть вокруг гайки. Рабочий ход по часовой,
     перехват — обратно, и обратный ход быстрее рабочего, как рукой и делают. */
  .rock{transform-box:view-box;transform-origin:0 0;
        animation:rock 24s ease-in-out infinite}
  @keyframes rock{
    0%,12%  {transform:translate(150px,116px) rotate(-10deg)}
    20%     {transform:translate(150px,116px) rotate(7deg)}
    23%     {transform:translate(150px,116px) rotate(7deg)}
    28%     {transform:translate(150px,116px) rotate(-10deg)}
    36%     {transform:translate(150px,116px) rotate(7deg)}
    39%     {transform:translate(150px,116px) rotate(7deg)}
    44%     {transform:translate(150px,116px) rotate(-10deg)}
    52%     {transform:translate(150px,116px) rotate(7deg)}
    55%     {transform:translate(150px,116px) rotate(7deg)}
    60%     {transform:translate(150px,116px) rotate(-10deg)}
    68%     {transform:translate(150px,116px) rotate(7deg)}
    /* Пока ключ снимается с гайки — угол ещё рабочий: снялся, и только тогда
       перекинулся. */
    71%     {transform:translate(150px,116px) rotate(7deg)}
    /* Перехват «под новый затяг» ЗАКАНЧИВАЕТСЯ здесь, ключ снят и отведён.
       Дальше — только подъём: он идёт СТРОГО ВЕРТИКАЛЬНО, без вращения, из
       того самого положения, из которого начался бы очередной затяг. */
    76%,100%{transform:translate(150px,116px) rotate(-10deg)}
  }
</style>
</head>
<body>

<div class="head">
  <img class="logo" src="/logo.webp" alt="KAGO" width="72" height="72">
  <span class="brand">KAGO</span>
  <span class="what" id="head-what">Выполняется автоматический тюнинг-прогон видеокарты</span>
</div>


<div class="wrap">
  <div class="card">
    <div class="stage"><span class="pill" id="synthetic-note" style="display:none">ВИРТУАЛЬНАЯ</span>
      <svg viewBox="0 26 380 262" role="img" aria-label="Видеокарта с тремя вентиляторами и отвёрткой">
        <defs>
          <linearGradient id="shroud" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4a525d"/><stop offset=".45" stop-color="#343b45"/>
            <stop offset="1" stop-color="#252b33"/>
          </linearGradient>
          <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5b6572"/><stop offset="1" stop-color="#3d4550"/>
          </linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e8c877"/><stop offset="1" stop-color="#a8862f"/>
          </linearGradient>
          <!-- сталь стержня: блик слева от центра, тень справа — цилиндр -->
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#5f6873"/><stop offset=".28" stop-color="#e6edf5"/>
            <stop offset=".55" stop-color="#b6c0cc"/><stop offset="1"   stop-color="#5a636e"/>
          </linearGradient>
          <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6b7480"/><stop offset=".3" stop-color="#dde4ec"/>
            <stop offset=".62" stop-color="#9ba5b1"/><stop offset="1" stop-color="#646d78"/>
          </linearGradient>
          <!-- Базовый тон ручки РОВНЫЙ. Объём даёт не он, а слои света ниже:
               смешивать градиент тела с текстурой — как раз то, что делало
               ручку плоской. -->
          <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#d9601f"/><stop offset="1" stop-color="#d9601f"/>
          </linearGradient>
          <!-- ТЕНЬ ЦИЛИНДРА: тёмное к обеим кромкам, светлое там, где нормаль
               смотрит на зрителя. Асимметрично — свет слева сверху. -->
          <linearGradient id="cylShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#000" stop-opacity=".66"/>
            <stop offset=".13"  stop-color="#000" stop-opacity=".26"/>
            <stop offset=".34"  stop-color="#000" stop-opacity="0"/>
            <stop offset=".58"  stop-color="#000" stop-opacity=".06"/>
            <stop offset=".82"  stop-color="#000" stop-opacity=".42"/>
            <stop offset=".95"  stop-color="#000" stop-opacity=".62"/>
            <stop offset="1"    stop-color="#000" stop-opacity=".5"/>
          </linearGradient>
          <!-- ЗЕРКАЛЬНЫЙ БЛИК: узкая горячая полоса, не размазанная по всей ручке -->
          <linearGradient id="cylSpec" x1="0" y1="0" x2="1" y2="0">
            <stop offset=".14" stop-color="#fff1e2" stop-opacity="0"/>
            <stop offset=".24" stop-color="#fff1e2" stop-opacity=".55"/>
            <stop offset=".3"  stop-color="#fff8f0" stop-opacity=".72"/>
            <stop offset=".38" stop-color="#fff1e2" stop-opacity="0"/>
          </linearGradient>
          <!-- ОТРАЖЁННЫЙ СВЕТ на тёмной кромке: в природе тень никогда не чёрная,
               её подсвечивает окружение. Без этой полосы цилиндр плоский. -->
          <linearGradient id="cylRim" x1="0" y1="0" x2="1" y2="0">
            <stop offset=".84" stop-color="#ff9d5e" stop-opacity="0"/>
            <stop offset=".93" stop-color="#ff9d5e" stop-opacity=".42"/>
            <stop offset="1"   stop-color="#ff9d5e" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="domeLight" cx=".5" cy=".5" r=".5">
            <stop offset="0"   stop-color="#fff3e6" stop-opacity=".5"/>
            <stop offset="1"   stop-color="#fff3e6" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="waistShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#000" stop-opacity="0"/>
            <stop offset=".55" stop-color="#000" stop-opacity=".3"/>
            <stop offset="1"   stop-color="#000" stop-opacity="0"/>
          </linearGradient>

          <!-- ЛОПАСТЬ: скошенная, от ступицы (r10) до обода (r31) -->
          <path id="blade"
                d="M-2.25,-9.74 L2.25,-9.74 Q11,-17.5 17.8,-25.4
                   A31,31 0 0 0 4.85,-30.62 Q1.6,-19.5 -2.25,-9.74 Z"/>

          <g id="fan">
            <rect x="-37" y="-37" width="74" height="74" rx="9" fill="#222830" stroke="#4d5661"/>
            <circle r="34.5" fill="#12161b" stroke="#525c68"/>
            <circle r="32.6" fill="none"    stroke="#2c333b"/>
            <g fill="#6d7885" opacity=".85">
              <circle cx="-30" cy="-30" r="2.3"/><circle cx="30" cy="-30" r="2.3"/>
              <circle cx="-30" cy="30"  r="2.3"/><circle cx="30" cy="30"  r="2.3"/>
            </g>
          </g>

          <g id="rotor">
            <use href="#blade"/>
            <use href="#blade" transform="rotate(32.73)"/>
            <use href="#blade" transform="rotate(65.45)"/>
            <use href="#blade" transform="rotate(98.18)"/>
            <use href="#blade" transform="rotate(130.9)"/>
            <use href="#blade" transform="rotate(163.6)"/>
            <use href="#blade" transform="rotate(196.4)"/>
            <use href="#blade" transform="rotate(229.1)"/>
            <use href="#blade" transform="rotate(261.8)"/>
            <use href="#blade" transform="rotate(294.5)"/>
            <use href="#blade" transform="rotate(327.3)"/>
          </g>

          <!-- СИЛУЭТ РУЧКИ: купол сверху, плечо, перехват, расширение к обойме.
               Точёная форма вместо бочонка — по ней же обрезаются грани. -->
          <path id="grip-shape"
                d="M0,-112
                   C 9,-112 15,-107 16,-99
                   C 17,-92 18,-86 18,-80
                   C 18,-73 14,-70 13,-66
                   C 12,-62 15,-59 16,-56
                   C 17,-53 15,-52 12,-52
                   L -12,-52
                   C -15,-52 -17,-53 -16,-56
                   C -15,-59 -12,-62 -13,-66
                   C -14,-70 -18,-73 -18,-80
                   C -18,-86 -17,-92 -16,-99
                   C -15,-107 -9,-112 0,-112 Z"/>
          <clipPath id="gripClip"><use href="#grip-shape"/></clipPath>
          <filter id="neon" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="1.1" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <!-- ПЛОСКАЯ КОВАНАЯ СТАЛЬ: тёмные кромки, светлая середина, узкая
               фаска. У плоской детали объём даёт именно фаска по контуру. -->
          <linearGradient id="wrenchBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#5b636d"/>
            <stop offset=".18" stop-color="#aab4c0"/>
            <stop offset=".42" stop-color="#e8eef5"/>
            <stop offset=".62" stop-color="#b9c3cf"/>
            <stop offset=".86" stop-color="#78818c"/>
            <stop offset="1"   stop-color="#4e565f"/>
          </linearGradient>
          <linearGradient id="wrenchBevel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#fff" stop-opacity=".0"/>
            <stop offset=".33" stop-color="#fff" stop-opacity=".55"/>
            <stop offset=".46" stop-color="#fff" stop-opacity=".0"/>
          </linearGradient>
        </defs>
        <!-- ── ПЛАТА, ЗАДНЯЯ ПЛАСТИНА, ГРЕБЁНКА PCIe ───────────────────── -->
        <!-- Медь идёт САМОЙ ПЕРВОЙ — ниже неё в рисунке нет ничего: ни платы,
             ни кожуха, ни кронштейна. Поэтому она выходит из-под всего сразу.
             Гребёнка сплошной медяшкой: зубы дробили взгляд. -->
        <g>
          <rect x="70" y="240" width="132" height="26" rx="1.5" fill="url(#gold)"/>
          <rect x="212" y="240" width="52" height="26" rx="1.5" fill="url(#gold)"/>
        </g>
        <rect x="34" y="230" width="316" height="22" rx="2" fill="#1e232a" stroke="#39424d"/>


        <!-- ── ГАЕЧНЫЙ КЛЮЧ ────────────────────────────────────────────────
             Вектор — Bootstrap Icons «wrench» (MIT), скачан и положен в
             assets/icons/. Рисовать такую форму руками я пробовал трижды и
             трижды получал подделку; готовый вектор честнее и чище.

             Ключ развёрнут на 180°, чтобы РОЖКОВЫЙ ЗЕВ оказался внизу, и стоит
             к карте под сильным углом — как и держат ключ, а не перпендикуляром.
             Точка зева совмещена с началом координат: вокруг неё идёт вращение,
             потому что вокруг гайки ключ и поворачивается.

             Рисуется ПЕРВЫМ после контактов — значит уходит за кожух сам. -->
        <g class="arm">
          <g class="rock">
              <g transform="scale(-1,1)">
              <g transform="translate(-75,-75) scale(5.6)">
                <g transform="rotate(180 8 8)">
                  <path d="M.102 2.223A3.004 3.004 0 0 0 3.78 5.897l6.341 6.252A3.003 3.003 0 0 0 13 16a3 3 0 1 0-.851-5.878L5.897 3.781A3.004 3.004 0 0 0 2.223.1l2.141 2.142L4 4l-1.757.364zm13.37 9.019.528.026.287.445.445.287.026.529L15 13l-.242.471-.026.529-.445.287-.287.445-.529.026L13 15l-.471-.242-.529-.026-.287-.445-.445-.287-.026-.529L11 13l.242-.471.026-.529.445-.287.287-.445.529-.026L13 11z" fill="url(#wrenchBody)" stroke="#39414a"
                        stroke-width=".22" stroke-linejoin="round"/>
                  <path d="M.102 2.223A3.004 3.004 0 0 0 3.78 5.897l6.341 6.252A3.003 3.003 0 0 0 13 16a3 3 0 1 0-.851-5.878L5.897 3.781A3.004 3.004 0 0 0 2.223.1l2.141 2.142L4 4l-1.757.364zm13.37 9.019.528.026.287.445.445.287.026.529L15 13l-.242.471-.026.529-.445.287-.287.445-.529.026L13 15l-.471-.242-.529-.026-.287-.445-.445-.287-.026-.529L11 13l.242-.471.026-.529.445-.287.287-.445.529-.026L13 11z" fill="url(#wrenchBevel)"/>
                </g>
              </g>
              </g>
            </g>
          </g>

        <!-- ── КРОНШТЕЙН, ВИД С РЕБРА ────────────────────────────────────
             Правка по замечанию владельца: раньше планка была развёрнута
             ЛИЦОМ к зрителю, с видимыми окнами разъёмов, — так не бывает.
             Кронштейн привинчен к задней стенке корпуса, то есть при виде
             сбоку он виден С РЕБРА: тонкая полоса металла с отогнутой
             верхней лапкой под винт. Никаких окон разъёмов отсюда не видно. -->
        <g>
          <rect x="24.5" y="124" width="4.5" height="144" fill="#4e5763"/>
          <rect x="24.5" y="124" width="4.5" height="144" fill="none" stroke="#3a424c" stroke-width=".6"/>
          <rect x="25.3" y="124" width="1" height="144" fill="#aebac7" opacity=".18"/>
          <!-- отогнутая лапка крепления, уходит к корпусу -->
          <path d="M24.5,124 L29,124 L29,118 L34,118 L34,121 L29,121 Z" fill="#4e5763" stroke="#3a424c" stroke-width=".6"/>
          <circle cx="31.6" cy="119.5" r="1.1" fill="#20262e"/>
          <!-- нижний упор -->
          <rect x="24.5" y="266" width="4.5" height="3.5" rx="1" fill="#454e59"/>
        </g>

        <!-- ── КОЖУХ ───────────────────────────────────────────────────── -->
        <path d="M30,130 L352,130 L352,246 L30,246 Z" fill="url(#shroud)" stroke="#5d6773"/>
        <path d="M30,130 L352,130 L352,144 L30,144 Z" fill="url(#rail)" opacity=".5"/>
        <g stroke="#1d222a" stroke-width="2" opacity=".6">
          <path d="M64,130 L48,144"/><path d="M334,130 L318,144"/>
          <path d="M64,246 L48,232"/><path d="M334,246 L318,232"/>
        </g>
        <g>
          <rect x="296" y="118" width="50" height="13" rx="2.5" fill="#2b323b" stroke="#69737f"/>
          <g fill="#4d5661">
            <rect x="300" y="121" width="9" height="7" rx="1"/><rect x="311" y="121" width="9" height="7" rx="1"/>
            <rect x="322" y="121" width="9" height="7" rx="1"/><rect x="333" y="121" width="9" height="7" rx="1"/>

        <!-- ── ТРИ ВЕНТИЛЯТОРА: один цвет, одна скорость ───────────────── -->
        <g transform="translate(94,178)">
          <use href="#fan"/>

          <g class="spin">

            <circle r="9" fill="#2b323b" stroke="#6d7885"/><circle r="3.2" fill="#6d7885"/>

        <!-- ── ЧЕТЫРЕ СЕМИСЕГМЕНТНЫХ ИНДИКАТОРА НА САМОЙ КАРТЕ ───────────
             Шрифт DSEG7 Classic (SIL OFL) — настоящий сегментный, встроен в

             Погашенные сегменты — штатный приём DSEG: тусклая «8888» подложкой,
             поверх неё яркое значение. Общего контейнера у панелей нет.
             Это ДАННЫЕ, а не анимация. -->
        <g>
          <g>
            <rect x="34" y="219" width="76" height="20" rx="2.5" fill="#04121e" stroke="#1d4055"/>
            <text x="38" y="227" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">CLK</text>

            <text id="seg-clk" class="seg on"  x="106" y="235" text-anchor="end">2842</text>

          <g>

            <text class="seg off" x="185" y="235" text-anchor="end">88</text>
            <text id="seg-temp" class="seg on"  x="185" y="235" text-anchor="end">74</text>
          </g>
          <g>
            <rect x="192" y="219" width="76" height="20" rx="2.5" fill="#04121e" stroke="#1d4055"/>
            <text x="196" y="227" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">FAN</text>
            <text x="196" y="236.5" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">%</text>
            <text class="seg off" x="264" y="235" text-anchor="end">88</text>
            <text id="seg-fan" class="seg on"  x="264" y="235" text-anchor="end">62</text>
          </g>
          <g>
            <rect x="271" y="219" width="76" height="20" rx="2.5" fill="#04121e" stroke="#1d4055"/>
            <text x="275" y="227" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">PWR</text>
            <text x="275" y="236.5" font-family="Consolas,Menlo,monospace" font-size="7.6" font-weight="700" fill="#3d86ff" letter-spacing=".9">W</text>
            <text class="seg off" x="343" y="235" text-anchor="end">888</text>
            <text id="seg-pwr" class="seg on"  x="343" y="235" text-anchor="end">248</text>

      </svg>
    </div>
  </div>

  <div>
    <!-- СОСТОЯНИЕ ПРОГОНА СТОИТ ПЕРВЫМ — правка владельца по первой же репетиции. И она по
         существу: оператор не читает колонку, он БРОСАЕТ на неё взгляд, а первое, что ему нужно
         знать, — идёт прогон или встал. Цифры отвечают на второй вопрос, не на первый. -->
    <p class="state alive" id="state-alive">● ПОДЪЁМ ПРОГОНА</p>
    <p class="state dead" id="state-dead">■ ЗАМЕРЛО</p>
    <div class="m"><span>частота под тестом</span><b id="f-freq">—</b></div>
    <!-- «4 из 24» убрано словом владельца: номер ступени внутри спуска не говорит оператору ничего.
         Говорит ГЛУБИНА — сколько уже снято от заводского напряжения. -->
    <div class="m"><span>напряжение</span><b id="f-volt">—</b>
      <span id="f-depth" style="text-transform:none;letter-spacing:0;font-size:13px;color:#c9d3df"></span></div>
    <!-- «прожиг» — жаргон (слово владельца 2026-08-16). На самом деле идёт СТРЕСС-ТЕСТ
         УСТОЙЧИВОСТИ, так и называем — здесь и во всём, что он читает. -->
    <div class="m"><span>стресс-тест устойчивости</span><b id="f-probe">—</b></div>
    <!-- «ПРОЙДЕНО по диапазону частот» СНЯТО как ложь: подпись обещала пройденное, а значение
         показывало ЗАКАЗАННУЮ полосу — владелец поймал это на первой же репетиции («врет. мы еще не
         дошли до 2157»). Подпись теперь называет ровно то, что под ней стоит; пройденное считает
         строка ниже, а где идёт фронт — видно по верхней плитке «частота под тестом». -->
    <div class="m"><span>диапазон прогона</span><b id="f-band">—</b>
      <span id="f-cov" style="text-transform:none;letter-spacing:0;font-size:13px;color:#c9d3df"></span></div>
    <!-- ДВОЕ ЧАСОВ, попрошены владельцем на первом полном прогоне. Они нарочно идут от РАЗНЫХ
         часов, и эта пара стоит больше любой своей половины: таймер прогона идёт ОТ ПУЛЬСА и
         замирает вместе с ним, стенные часы идут сами. Расстояние между ними — это «давно ли
         встало», число, которое иначе оператор в три часа ночи вычисляет по памяти. -->
    <div class="m clocks">
      <div><span>время прогона</span><b id="c-elapsed">0:00:00</b></div>
      <div><span>время локальное</span><b id="c-now">--:--:--</b></div>
    </div>
  </div>
</div>


<script>
/* ==================================================================================================
   ЖИВОЙ ПРОГОН — проводка страницы (`plans/20` §4.4, из `ideas/06`)
   ==================================================================================================

   🔴 ГЛАВНОЕ ЗДЕСЬ ОДНО, И ОНО НЕ ПРО КРАСОТУ: анимация, которая крутится от СВОЕГО таймера, — лжец.
   Она будет бодро махать, когда прогон уже мёртв, а машина жива (убитый драйвер, TDR, упавший
   процесс) — и оператор будет ждать того, чего не будет. Поэтому фаза анимации здесь — ФУНКЦИЯ
   ПОСЛЕДНЕГО ПУЛЬСА: ключевые кадры, принятые владельцем, ставятся на паузу, а время им выдаёт
   пришедшая с прогона отметка `runMs`.

   ЧЕСТНАЯ ЦЕНА, НАЗВАННАЯ ВСЛУХ: пульс приходит примерно раз в секунду, а глаз ловит рывки, поэтому
   между пульсами время ЭКСТРАПОЛИРУЕТСЯ — но не дальше поводка ниже. То есть после смерти прогона
   картинка живёт ещё максимум `LEASH_MS`, и это её предел; дальше она стоит намертво, а через
   `FREEZE_MS` зажигается тревога. Никакого «а вдруг ещё придёт» здесь нет.
   ================================================================================================== */

const FREEZE_MS = 3000;   // столько без пульса — и это уже тревога, а не задержка
const LEASH_MS  = 1500;   // насколько анимации разрешено уехать вперёд последнего пульса

const $ = (id) => document.getElementById(id);
// Шапка — тоже утверждение. Пишется через одну функцию, чтобы у неё был один автор.
const head = (text) => { const e = $('head-what'); if (e && e.textContent !== text) e.textContent = text; };
const fmt = (v, unit, digits = 0) => (v === null || v === undefined ? '—' : `${Number(v).toFixed(digits).replace('.', ',')} ${unit}`);
const hms = (ms) => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const p2 = (n) => String(n).padStart(2, '0');
  return `${Math.floor(t / 3600)}:${p2(Math.floor(t / 60) % 60)}:${p2(t % 60)}`;
};
const seg = (id, v, width) => {
  const el = $(id);
  if (!el) return;
  el.textContent = (v === null || v === undefined) ? '-'.repeat(width) : String(Math.round(v));
};

let pulse = null;         // последний пришедший пульс
let pulseAt = 0;          // когда он пришёл, по часам БРАУЗЕРА (часы прогона могли встать)
let anims = [];

/* Принятые ключевые кадры остаются ровно теми же — мы только отбираем у них собственные часы. */
function seizeAnimations() {
  anims = [...document.querySelectorAll('.spin,.arm,.rock')].flatMap((el) => el.getAnimations());
  anims.forEach((a) => a.pause());
}

function paint() {
  if (!pulse) return;
  const r = pulse.run || {};
  const c = pulse.card || {};

  $('f-freq').textContent = r.frequencyMhz ? `${r.frequencyMhz} МГц` : '—';
  $('f-volt').textContent = r.voltageMv ? `${r.voltageMv} мВ` : '—';
  $('f-depth').innerHTML = (r.stockVoltageMv && r.depthMv !== null && r.depthMv !== undefined)
    ? `сток ${r.stockVoltageMv} · андервольт <b style="display:inline;font-size:13px;color:var(--ok)">−${r.depthMv} мВ</b>`
    : '';
  const p = r.probe || {};
  $('f-probe').innerHTML = `${(p.elapsedSeconds ?? 0).toFixed(1).replace('.', ',')} `
    + `<span style="font-size:17px;color:var(--dim)">из ${p.totalSeconds ?? 10} с</span>`;
  $('f-band').textContent = r.band || '—';
  const cov = r.coverage || {};
  // «Ступеней пройдено» УБРАНО словом владельца: ступень спуска по напряжению — внутренняя единица
  // движка, и оператору она не говорит ничего, ровно как убранная раньше «ступень N из M».
  // Осталось то, что говорит: сколько частот диапазона уже настроено.
  // ГДЕ ИДЁТ ФРОНТ — первое, что спросил владелец, глядя на прогон. Спуск идёт СВЕРХУ ВНИЗ (его
  // алгоритм, ideas/03 §6), поэтому положение — это доля пройденного пути от верхней частоты к нижней.
  const front = r.frequencyMhz;
  let walked = '';
  if (front && r.bandFromMhz && r.bandToMhz && r.bandFromMhz > r.bandToMhz) {
    const pct = Math.round(100 * (r.bandFromMhz - front) / (r.bandFromMhz - r.bandToMhz));
    walked = `<span style="white-space:nowrap">спустились до <b style="display:inline;font-size:13px">${front} МГц</b> — это ${pct} % пути</span><br>`;
  }
  $('f-cov').innerHTML = cov.total
    ? walked + `<span style="white-space:nowrap">настроено частот <b style="display:inline;font-size:13px">${cov.closed ?? 0} из ${cov.total}</b></span>`
    : walked;

  seg('seg-clk', c.clockMhz, 4);
  seg('seg-temp', c.tempC, 2);
  seg('seg-fan', c.fanPct, 2);
  seg('seg-pwr', c.powerW, 3);
  $('synthetic-note').style.display = c.synthetic ? 'inline-block' : 'none';

  // ДВОЕ ЧАСОВ. Таймер прогона идёт ОТ ПУЛЬСА — значит замирает вместе с прогоном и показывает,
  // на какой секунде тот встал; стенные часы идут сами. Их расхождение и есть «давно ли встало».
  $('c-elapsed').textContent = hms(pulse.runMs);

  $('state-alive').textContent = `● ${r.state || 'ПРОГОН'}`;
  document.title = r.finished
    ? 'KAGO — прогон завершён'
    : 'KAGO — Выполняется автоматический тюнинг-прогон видеокарты';
}

/* Кадр. Всё, что здесь считается, считается ОТ ПУЛЬСА. */
function frame() {
  requestAnimationFrame(frame);
  if (!pulse) return;
  // ВОЗРАСТ ЗАПИСИ + СОБСТВЕННОЕ ОЖИДАНИЕ. Второе слагаемое очевидно, первое — нет, и без него окно
  // лгало: открытое между прогонами, оно получало прибор ПРОШЛОГО прогона и, только что его получив,
  // считало секундной давности. Владелец увидел это сразу: «запустилось в состоянии прогон оставлен».
  // Сервер теперь присылает настоящий возраст записи, и отсчёт идёт от него.
  const since = (Number(pulse.ageMs) || 0) + (performance.now() - pulseAt);

  // ПРОГОНА НЕТ — это ОТДЕЛЬНОЕ состояние, а не «зависший прогон». Пустой прибор означает, что не
  // идёт ничего; рисовать по нему тревогу значило бы обесценить тревогу ещё одним способом.
  if (pulse.noRun) {
    document.body.classList.remove('hung');
    $('state-alive').textContent = `● ПРОГОНА НЕТ — ${pulse.run.note || 'ожидание запуска'}`;
    // ШАПКА ТОЖЕ УТВЕРЖДЕНИЕ, а не украшение. В макете «Выполняется автоматический тюнинг-прогон»
    // верно по условию; на живой странице это ЛОЖЬ всякий раз, когда прогона нет — и владелец
    // увидел её крупными буквами прямо над панелью «ПРОГОНА НЕТ». Один экран не может говорить
    // двух разных вещей: на что упадёт взгляд, то человек и прочтёт.
    head('Прогон не запущен — окно ждёт');
    document.title = 'KAGO — прогона нет';
    return;
  }
  head('Выполняется автоматический тюнинг-прогон видеокарты');

  // Прогон, который ЗАКОНЧИЛСЯ, не должен выглядеть зависшим — иначе тревога обесценится в первый же
  // штатный финал, и оператор перестанет ей верить.
  // СКОЛЬКО МОЛЧАНИЯ СЕЙЧАС НОРМАЛЬНО — говорит САМ ПРОГОН, а не гадает страница.
  //
  // Он блокируется на время стресс-теста: нагрузка запускается синхронно, и десять секунд из процесса
  // не выходит НИЧЕГО — ни по SSE, ни по сокету, потому что стоит цикл событий, а не транспорт.
  // Со старым фиксированным терпением в 3 с тревога загоралась НА КАЖДОЙ ступени, все 68 раз за
  // прогон. Тревога, которая врёт по расписанию, отменяет сама себя — и настоящее зависание,
  // ради которого она заведена, оператор уже не отличит.
  //
  // Поэтому прогон перед прожигом объявляет свой бюджет молчания (`quietMs`), и страница судит по
  // нему. Молчание В ПРЕДЕЛАХ объявленного — это прожиг, и так и написано. Молчание СВЕРХ него —
  // это зависание, и написано будет это. Оба утверждения правдивы.
  const quiet = Number(pulse.quietMs) > 0 ? Number(pulse.quietMs) : FREEZE_MS;
  const frozen = !pulse.run.finished && since > quiet;
  document.body.classList.toggle('hung', frozen);
  const r = pulse.run;
  if (frozen) {
    // ПЕРЕБРАЛ СВОЙ ЖЕ БЮДЖЕТ. Насколько именно — на экране: «встало 4 секунды назад» и «встало три
    // минуты назад» требуют от оператора разных действий.
    $('state-dead').textContent = r.frequencyMhz
      ? `■ ЗАМЕРЛО на ${((since - quiet) / 1000).toFixed(0)} с сверх ожидаемого — ${r.frequencyMhz} МГц / ${r.voltageMv ?? '?'} мВ`
      : '■ ЗАМЕРЛО';
  } else if (!r.finished && quiet > FREEZE_MS) {
    // ИДЁТ ПРОЖИГ, и это ЖИВОЕ состояние.
    // СЧЁТЧИК СЕКУНД ОТСЮДА УБРАН — слово владельца 2026-08-16 23:3x, глядя на живой прогон:
    // «● ИДЁТ СТРЕСС-ТЕСТ — 10 с из 10 · Тут нужно убрать секунд счётчик». Строка состояния отвечает
    // на вопрос «что сейчас происходит», а не «сколько осталось»: секунды ползли до потолка и там
    // стояли, то есть большую часть времени показывали «10 из 10» и не значили ничего.
    // Прогресс пробы остался там, где ему место — в своём виджете (`f-probe`).
    $('state-alive').textContent = `● ${r.state || 'ПРОГОН'}`;
  }

  const t = pulse.runMs + Math.min(since, LEASH_MS);
  for (const a of anims) {
    try { a.currentTime = t; } catch (e) { /* анимация ушла — не за что держаться */ }
  }
}

function connect() {
  const es = new EventSource('/live');
  es.onmessage = (m) => {
    try { pulse = JSON.parse(m.data); } catch (e) { return; }
    pulseAt = performance.now();
    paint();
  };
  // Разрыв — это НЕ «всё хорошо»: сервер мог умереть вместе с машиной. Ничего не сбрасываем,
  // не рисуем ложного спокойствия — молчание само зажжёт тревогу через FREEZE_MS.
  es.onerror = () => {};
}

/* Стенные часы браузера — единственное на этой странице, что НЕ приходит с прогона, и это
   намеренно: они обязаны идти, когда всё остальное встало. */
function wallClock() {
  const d = new Date();
  const p2 = (n) => String(n).padStart(2, '0');
  $('c-now').textContent = `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}
wallClock();
setInterval(wallClock, 1000);

seizeAnimations();
requestAnimationFrame(frame);
connect();
</script>
</body>
</html>
